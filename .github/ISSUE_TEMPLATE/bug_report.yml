name: Bug report
description: Report a reproducible problem with PhotoCull.
title: ""
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected. Do not attach private photos or settings.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PhotoCull version and operating system
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Camera, file format and relevant logs
      description: Prefer a minimal synthetic example. Redact personal paths and metadata.
