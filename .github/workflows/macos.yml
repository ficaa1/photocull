name: macOS validation
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'test/**', 'scripts/**', 'package*.json', '.github/workflows/macos.yml']
  pull_request:
    paths: ['src/**', 'test/**', 'scripts/**', 'package*.json', '.github/workflows/macos.yml']
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run test:ui
      - run: npm run pack:mac -- $(node -p process.arch)
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoCull-${{ matrix.os }}
          path: |
            release/PhotoCull-macOS-*.zip
            artifacts/*.png
            artifacts/ui-smoke.json
