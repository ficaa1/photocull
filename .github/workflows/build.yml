name: Build
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v-prefixed tag to build and attach installers to
        required: true
        type: string
  push:
    branches: [main]
    tags: ['v*']
    paths: ['src/**', 'src-tauri/**', 'test/**', 'scripts/**', 'package*.json', '.github/workflows/build.yml']
  pull_request:
    paths: ['src/**', 'src-tauri/**', 'test/**', 'scripts/**', 'package*.json', '.github/workflows/build.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI-smoke-${{ matrix.os }}
          path: |
            artifacts/*.png
            artifacts/ui-smoke.json
          if-no-files-found: ignore

  build:
    if: ${{ !github.event.repository.private && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      # The staged sidecar is this exact Node binary, so use the official build.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run build
      # Without a valid bundle signature, macOS calls a downloaded app "damaged".
      - name: Check the ad-hoc signature
        if: runner.os == 'macOS'
        run: |
          app=src-tauri/target/release/bundle/macos/PhotoCull.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -q 'Signature=adhoc'
          codesign -d --entitlements - "$app/Contents/MacOS/node" | grep -q allow-jit
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoCull-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*-setup.exe
            artifacts/*.png
            artifacts/ui-smoke.json

  release:
    needs: build
    if: ${{ !github.event.repository.private && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))) }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PhotoCull-*
          path: installers
          merge-multiple: true
      - name: Release title
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: echo "RELEASE_NAME=PhotoCull ${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ env.RELEASE_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            installers/**/*.msi
            installers/**/*-setup.exe
            installers/**/*.dmg
