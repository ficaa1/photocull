[package]
name = "photocull"
version = "0.7.0"
description = "A local, preview-first RAW and JPEG culling desktop app"
edition = "2021"
publish = false

[lib]
name = "photocull_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
trash = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
